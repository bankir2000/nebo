<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Герб Сумської області (щит) — векторна відтворка за зображенням від користувача.
       Для точної геральдики замініть на офіційний файл герба. -->
  <rect width="200" height="200" rx="28" fill="#f0f4f8"/>
  <!-- щит: блакитне поле, жовта окантовка, закруглений низ -->
  <path d="M50 40 H150 V118 Q150 150 100 172 Q50 150 50 118 Z" fill="#38b2e8" stroke="#f5d20a" stroke-width="6" stroke-linejoin="round"/>
  <!-- корона-маківка (золота баня зі шпилем) -->
  <path d="M88 84 Q84 62 102 50 Q120 62 116 84 Z" fill="#f5d20a" stroke="#1f2937" stroke-width="1"/>
  <path d="M102 50 L102 42" stroke="#f5d20a" stroke-width="2"/>
  <rect x="86" y="84" width="32" height="6" fill="#f5d20a" stroke="#1f2937" stroke-width="1"/>
  <!-- колосок (ліворуч) -->
  <path d="M104 147 C78 140 70 115 78 95" fill="none" stroke="#f5d20a" stroke-width="4" stroke-linecap="round"/>
  <path d="M78 95 L100 88" fill="none" stroke="#f5d20a" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#f5d20a" stroke-width="2" stroke-linecap="round">
    <path d="M76 110 L68 106"/><path d="M75 118 L67 115"/><path d="M80 102 L72 97"/><path d="M90 96 L92 89"/><path d="M97 93 L99 86"/>
  </g>
  <!-- хрест (праворуч від колоска) -->
  <path d="M113 102 V141 M96 118 H130" stroke="#f5d20a" stroke-width="5" stroke-linecap="round"/>
  <path d="M109 104 H117 M109 139 H117 M98 118 V113 M98 118 V123 M128 118 V113 M128 118 V123" stroke="#f5d20a" stroke-width="3" stroke-linecap="round"/>
</svg>
